<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <title>Youtube Thumbnail Clone</title>

        <div class="video-card">

                <img class="tpicture" src="pictures/hq720.avif">
            </div>
            <div class="bottom">
                <div class="channel-picture"> <!--inline-block-->
                    <img class="cpicture" src="pictures/channels4_profile.jpg">
                </div>
                <div class="stats"> <!--inline-block-->
                    <div class="title">
                        <p class="title_text">INDIA'S GOT LATENT S2 EP6 ft. Rakhi Sawant, Ashneer Grover, Kushagra ...</p>
                    </div>
                    <div class="channel">
                    <div>
                        <div class="channel_name">
                            <p class="channel_text">Samay Raina</p>
                        </div>
                        <div class="tick_mark">
                            <img class="tick" src="pictures/tick.png">
                        </div>
                    </div>
                    </div>
                    <div class="views">
                        <p class="views_text">13m views &#183; 21 hours ago</p>
                    </div>
                </div>
            </div>
            <div class="three">
                <button class="buton">&#8942;</button>
            </div>
        </div>
    </body>
